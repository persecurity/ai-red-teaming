services:
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:0.11.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      CONFIGURED_JUDGE_MODEL: ${CONFIGURED_JUDGE_MODEL:-qwen3:8b}
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-llama-guard3:1b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./scripts/ollama-init.sh:/ollama-init.sh:ro
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:5000/health', timeout=3).raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    environment:
      SECURITY_LEVEL: ${SECURITY_LEVEL:-1}
      MODEL_PROFILE: ${MODEL_PROFILE:-8B-single}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      CONFIGURED_JUDGE_MODEL: ${CONFIGURED_JUDGE_MODEL:-qwen3:8b}
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-llama-guard3:1b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      RAG_MIN_VECTOR_SCORE: ${RAG_MIN_VECTOR_SCORE:-0.35}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      PARTNER_GATEWAY_PORT: ${PARTNER_GATEWAY_PORT:-8000}
      SCAN_UPLOADS_WITH_GUARD: ${SCAN_UPLOADS_WITH_GUARD:-false}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-training-only-change-me}
      DATABASE_PATH: /lab/data/lab.db
      CHROMA_PATH: /lab/chroma
      ANONYMIZED_TELEMETRY: "false"
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-true}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-pg-airlines-local}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pg-airlines}
    volumes:
      - app-data:/lab/data
      - chroma-data:/lab/chroma

  partner-gateway:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.partner_gateway"]
    ports:
      - "127.0.0.1:${PARTNER_GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      PARTNER_GATEWAY_HOST: 0.0.0.0
      PARTNER_GATEWAY_PORT: 8000
      PARTNER_API_KEY: ${PARTNER_API_KEY:-pgair-partner-demo-only}
      UPSTREAM_ASSISTANT_URL: http://app:5000/api/v2/assistant

volumes:
  ollama-models:
  app-data:
  chroma-data:
